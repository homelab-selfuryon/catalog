name: CI

# Checks of a pull request and of main: formatting, `cue vet`, `cue cmd generate`, the layout and
# schema tests (`devenv test`), workflow lint. The generated files (catalog.json and one view per
# repository, views.cue) are kept as a run artifact.
#
# On main (push, or a manual run to resend), `sync` sends each repository its view from that same
# run, as a PR from the branch `catalog/sync` (meta delivery.md, "Catalog"). It does not wait for
# any of them: the owner merges and applies platform-terraform first, then the others, and each
# repository's own checks validate what arrives. A newer run updates the open PR.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVENV_VERSION: v2.4.0

jobs:
  test:
    name: Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv # read-only: the public devenv cache, no auth token
      - name: Install devenv
        run: |
          nix profile install --accept-flake-config --profile "$RUNNER_TEMP/devenv" "github:cachix/devenv/${DEVENV_VERSION}#devenv"
          echo "$RUNNER_TEMP/devenv/bin" >> "$GITHUB_PATH"
      # treefmt, cue vet, generate, layout, schema tests, shellcheck
      - name: devenv test
        run: devenv test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog
          path: out/*.json
          if-no-files-found: error

  lint:
    name: Lint workflows
    permissions:
      contents: read
    uses: homelab-selfuryon/github-workflows/.github/workflows/lint-workflows.yaml@355d9b419dbbc6772aee02003b14ee1496122e98 # v1.1.1

  # One PR per repository that reads the catalog. The token comes from octo-sts, identity
  # `catalog-sync`, whose policy lives in that repository (.github/chainguard/catalog-sync.sts.yaml)
  # and admits only this workflow on main of this repository.
  sync:
    name: Sync ${{ matrix.repo }}
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      id-token: write # octo-sts
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: platform-terraform
            file: catalog.json
            note: "Merge this one first, then run `tofu apply` in `github/` and `openbao/`: the other repositories' checks expect the GitHub team and repository to exist."
          - repo: platform-components
            file: teams/catalog.json
            note: "Merge after platform-terraform's PR is applied: namespaces, quotas, RBAC and AppProjects of tenant teams."
          - repo: gitops
            file: catalog.json
            note: "Merge after platform-terraform's PR is applied (gitops-verify compares every app's team with its repository's `owner-team`). Carries what `scripts/gitops_checks.py sync` derives: `{}` version files of new apps, the removal of apps that left, the CODEOWNERS block."
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog
          path: ${{ runner.temp }}/catalog

      - name: Token for ${{ matrix.repo }}
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: homelab-selfuryon/${{ matrix.repo }}
          identity: catalog-sync

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: homelab-selfuryon/${{ matrix.repo }}
          path: target
          token: ${{ steps.octo-sts.outputs.token }}
          persist-credentials: false

      - name: Copy catalog.json
        run: |
          set -euo pipefail
          # The repository's view (views.cue), not the whole catalog.
          cp "$RUNNER_TEMP/catalog/${REPO}.json" "target/$FILE"
          # gitops derives its version files and CODEOWNERS lines from the file (its own script, from
          # its main; standard library only).
          if [[ "$REPO" == gitops ]]; then
            python3 -I target/scripts/gitops_checks.py sync --root target
          fi
          {
            echo "\`$FILE\` (this repository's view, \`views.cue\`) from [catalog@${GITHUB_SHA::7}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}), generated by \`cue cmd generate\`; never edit it here, change the catalog."
            echo
            echo "$NOTE"
            echo
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$RUNNER_TEMP/pr-body.md"
        env:
          REPO: ${{ matrix.repo }}
          FILE: ${{ matrix.file }}
          NOTE: ${{ matrix.note }}

      - name: Open or update the PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          path: target
          token: ${{ steps.octo-sts.outputs.token }}
          branch: catalog/sync
          sign-commits: true
          delete-branch: true
          title: "chore(catalog): sync catalog.json"
          commit-message: "chore(catalog): sync catalog.json"
          body-path: ${{ runner.temp }}/pr-body.md

  # The single required status check (branch ruleset). `sync` runs after it on main and is not part
  # of it: a PR never runs sync.
  final-check:
    needs: [test, lint]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        run: |
          for r in "test=$TEST" "lint=$LINT"; do
            [[ "${r#*=}" == success ]] || { echo "$r"; exit 1; }
          done
        env:
          TEST: ${{ needs.test.result }}
          LINT: ${{ needs.lint.result }}
